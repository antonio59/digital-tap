packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# pnpm applies these; top-level package.json "overrides" is npm-only.
# Keep majors that already exist in the tree (do not force 1.x -> 5.x).
overrides:
  postcss: ^8.5.26
  nanoid@3: 3.3.18
  js-yaml: ^4.3.2
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  ws@8: 8.21.3
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  '@babel/core': ^7.29.6
  # miniflare pins sharp@0.35.4; GHSA-wq5f-xc86-pv6w is fixed in >=0.35.5.
  sharp@0.35.4: 0.35.5
  # @tailwindcss/node@4.3.3 resolves source-map-js@^1.2.1 to 1.2.1.
  # GHSA-68fv-2mgg-jv7q is fixed in >=1.2.2.
  source-map-js@1: 1.2.2
  # miniflare@5.20261019.2-beta (wrangler 4.152.0) pins undici@7.29.1.
  # GHSA-xjj6-f33q-929c (CVE-2026-109869), CVE-2026-109841, and
  # CVE-2026-109924 are fixed in >=7.30.1.
  undici@7.29.1: 7.30.1
