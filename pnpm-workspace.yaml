packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# pnpm applies these; top-level package.json "overrides" is npm-only.
# Keep majors that already exist in the tree (do not force 1.x -> 5.x).
overrides:
  postcss: ^8.5.26
  nanoid@3: 3.3.18
  js-yaml: ^4.3.2
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  ws@8: 8.21.3
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  '@babel/core': ^7.29.6
